server {
  listen 8080;
  server_name _;

  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Security Headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; worker-src 'self' blob:; connect-src 'self' https://openrouter.ai https://generativelanguage.googleapis.com https://*.supabase.co https://cdn.jsdelivr.net https://pypi.org https://files.pythonhosted.org; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

  # Block hidden files (e.g. .env, .git)
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Immutable cache for hashed static assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache index.html or Service Worker so updates apply immediately
  location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
